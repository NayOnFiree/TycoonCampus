  <button class="direction" data-theme="night" aria-pressed="false"><div class="swatches"><b style="background:#252a2d"></b><b style="background:#dfb470"></b><b style="background:#32383c"></b></div><small>03 / URBAIN</small><strong>Métropole</strong><p>Anthracite et ambre. Un HUD de gestion sobre et précis.</p></button>
 </section>
 <div class="toolbar"><div class="tabs" aria-label="Écran à prévisualiser"><button data-screen="game" aria-pressed="true">En partie</button><button data-screen="planning" aria-pressed="false">Planning</button><button data-screen="menu" aria-pressed="false">Menu principal</button></div><span class="artboard-label" id="board-label">01 — HÉRITAGE / EN PARTIE</span><button class="preview-toggle" id="focus" aria-pressed="false">Agrandir la maquette ↗</button></div>
 <section class="artboard" data-theme="heritage" id="artboard" aria-label="Maquette interactive de Campus"></section>
 <footer class="notes"><div><strong id="design-note"></strong><br>Prototype interactif · Données fictives · 3 directions × 3 écrans · Sans dépendance externe</div><div class="palette" id="palette"></div></footer>
</main>
<script>
'use strict';
// Les trois directions partagent les données, mais changent de palette et de composition.
const themes={heritage:{name:'Campus',number:'01',note:'Campus : crème neutre et brun tabac, panneaux compacts et commandes discrètes.',colors:['#352a23','#f5eedf','#713c3d']},modern:{name:'Horizon',number:'02',note:'Horizon : surfaces claires, accent vert sauge, HUD compact et temps en bas à droite.',colors:['#f3f5f2','#467564','#ffffff']},night:{name:'Métropole',number:'03',note:'Métropole : anthracite, accent ambre et panneaux utilitaires au-dessus du campus.',colors:['#252a2d','#dfb470','#32383c']}};
const state={theme:'modern',screen:'game',speed:'pause',room:'Gymnase 01',scheduled:false};
const board=document.getElementById('artboard');
// Illustration vectorielle originale : décor schématique, pas un rendu du moteur du jeu.
function scene(){return `<div class="map"><svg viewBox="0 0 1200 690" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration isométrique d'un campus arboré"><defs><pattern id="grass" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M8 9h2m18 15h2" stroke="#8fa17b" opacity=".25"/></pattern><filter id="shadow"><feDropShadow dx="9" dy="15" stdDeviation="8" flood-color="#465b38" flood-opacity=".22"/></filter><g id="tree"><path d="M0 0v27" stroke="#77674d" stroke-width="6"/><ellipse cy="-8" rx="21" ry="28" fill="#708757"/><ellipse cx="-7" cy="-15" rx="13" ry="20" fill="#8a9c69"/></g><g id="building"><path d="M0 0 180 -80 310 -15 130 68Z" fill="#ece6d5"/><path d="M0 0v90l130 69V68Z" fill="#b3a28a"/><path d="M130 68v91l180 -84v-90Z" fill="#d8cab0"/><path d="M-7 -4 180 -94 321 -20 130 76Z" fill="#746b5c"/><path d="M15 -6 181 -82 297 -21 130 59Z" fill="#908576"/><path d="M34 43v30m32 -13v30m32 -13v30" stroke="#625d4e" stroke-width="17"/><path d="M158 87v31m35 -48v31m35 -48v31m35 -48v31" stroke="#7c8274" stroke-width="19"/><path d="M50 -9 167 -61 254 -19 136 35Z" fill="#a29a8b"/></g></defs><path fill="#bbc5a4" d="M0 0h1200v690H0z"/><path fill="url(#grass)" d="M0 0h1200v690H0z"/><path d="m-100 430 1400-650M-100 710 1400-650M-130 0l1460 740M310 -100l1000 520" stroke="#dce0c8" stroke-width="35"/><path d="m-100 710 1400-650" stroke="#c4c8b3" stroke-width="3" stroke-dasharray="2 9"/><g filter="url(#shadow)"><use href="#building" transform="translate(135 180) scale(.8)"/><use href="#building" transform="translate(530 185) scale(.65)"/><use href="#building" transform="translate(800 395) scale(.95)"/><g transform="translate(385 350)"><path d="m-12 70 190 -89 150 72 -188 94Z" fill="none" stroke="#f8f0d7" stroke-width="3"/><use href="#building"/><path d="M50 -9 167 -61 254 -19 136 35Z" fill="#b6a381"/><path d="m85 -6 78 -34 59 28 -78 35Z" fill="#9a8768" stroke="#e1d7bf"/><path d="m115 -19 59 28m-49 5 78-35" stroke="#e1d7bf"/></g></g><g>${[[90,330],[155,365],[235,405],[300,445],[90,565],[175,605],[700,335],[765,365],[780,180],[850,145],[920,110],[470,110],[1070,565],[1125,600],[550,590],[605,620],[665,648],[315,140]].map(([x,y])=>`<use href="#tree" transform="translate(${x} ${y})"/>`).join('')}</g><g fill="#6b5a45"><circle cx="348" cy="520" r="4"/><circle cx="366" cy="527" r="4"/><circle cx="721" cy="421" r="4"/><circle cx="170" cy="466" r="4"/></g><g transform="translate(526 265)"><rect x="-54" y="-25" width="108" height="30" rx="4" fill="#fffaf0"/><text text-anchor="middle" y="-5" font-family="Segoe UI,sans-serif" font-size="11" fill="#34291f">Gymnase 01</text><path d="m-5 5 5 6 5-6" fill="#fffaf0"/></g></svg></div>`}
function header(){return '<header class="topbar"><div class="wordmark"><span class="crest">C</span>CAMPUS</div><div class="finance"><span class="overline">Budget disponible</span><strong>40 000 €</strong></div><div class="finance optional"><span class="overline">Cette semaine</span><strong class="positive">+2 450 €</strong></div><div class="campus-health"><span>♙ <b>128</b> étudiants</span><span>● <b>92 %</b> satisfaction</span></div></header>'}
function timeControl(){return '<aside class="time-control" aria-label="Horloge et vitesse"><div class="clock-heading"><span class="season">AUTOMNE · SEM. 01</span><span class="clock-status">'+(state.speed==='pause'?'EN PAUSE':'EN COURS')+'</span></div><div class="clock-main"><div class="clock-date"><strong>08:00</strong><span>Lundi 7 septembre</span></div><div class="speed">'+[['pause','Ⅱ'],['1','×1'],['2','×2'],['4','×4']].map(([v,t])=>'<button data-speed="'+v+'" aria-label="'+(v==='pause'?'Pause':'Vitesse '+v)+'" aria-pressed="'+(state.speed===v)+'">'+t+'</button>').join('')+'</div></div><div class="day-progress"><i></i></div></aside>'}
function game(){return `${header()}<div class="game">${scene()}<div class="map-label">Domaine de Montbrun<span>CAMPUS NORD · AUTOMNE</span></div><aside class="inspector"><div class="panel-cover"><div><span class="overline">Installations sportives</span><div style="margin-top:9px;font-size:12px">Campus nord / Bâtiment A</div></div><span class="building-badge">SPORT</span></div><div class="panel-body"><h2>Gymnase 01</h2><span class="status">● Ouvert · Prêt à accueillir</span><div class="detail-row"><span>Horaires d'ouverture</span><strong>08:00 — 22:00</strong></div><div class="detail-row"><span>Capacité</span><strong>32 étudiants</strong></div><div style="margin-top:20px"><span class="overline">Occupation planifiée</span><div style="display:flex;align-items:baseline;gap:8px;margin-top:8px"><strong style="font-size:22px">42 %</strong><span class="muted">cette semaine</span></div><div class="meter"><i></i></div><span class="muted">41 heures réservées sur 98 disponibles</span></div><button class="primary" data-goto="planning">Ouvrir le planning <span style="float:right">↗</span></button><button class="secondary" data-action="finance">Consulter les finances</button></div></aside><aside class="objective"><span class="overline">Votre prochain objectif</span><strong>Un campus qui prend vie</strong><div class="muted">Programmez la première séance de votre équipe universitaire.</div><div class="meter"><i style="width:${state.scheduled?'100':'66'}%"></i></div><span class="muted">${state.scheduled?'3':'2'} / 3 étapes accomplies</span></aside><nav class="dock" aria-label="Menu du jeu">${[['⌂','Construire','B','build'],['⌁','Chemins','C','paths'],['▦','Planning','P','planning'],['♙','Personnel','E','staff'],['▥','Finances','F','finance']].map(([i,l,k,a])=>`<button class="${a==='build'?'active':''}" ${a==='planning'?'data-goto':'data-action'}="${a}"><span class="symbol" aria-hidden="true">${i}</span>${l} <kbd>${k}</kbd></button>`).join('')}</nav></div>`}
function planning(){const events={0:['Basket universitaire','08:00 – 10:00'],7:['Entraînement libre','10:00 – 12:00'],14:['Équipe première','14:00 – 16:00'],18:['Basket universitaire','16:00 – 18:00']};if(state.scheduled)events[2]=['Nouvelle séance','08:00 – 10:00'];return `${header()}<section class="planner"><div class="page-heading"><div><span class="overline">Organisation / Semaine 01</span><h2>Planning des installations</h2><span class="muted">Semaine du 7 au 11 septembre · Semestre 1</span></div><button class="primary" data-action="schedule">+ Programmer une séance</button></div><div class="planner-layout"><aside class="rooms"><span class="overline">Vos installations</span>${['Gymnase 01','Amphithéâtre','Bibliothèque'].map((r,i)=>`<button class="room" data-room="${r}" aria-pressed="${state.room===r}">${r}<small>${['32 places · Sport','120 places · Enseignement','64 places · Étude'][i]}</small></button>`).join('')}<button class="secondary" data-goto="game">← Retour au campus</button></aside><div><div class="calendar"><div class="calendar-grid"><div></div>${['LUN. 07','MAR. 08','MER. 09','JEU. 10','VEN. 11'].map(d=>`<div class="day">${d}</div>`).join('')}${Array.from({length:4},(_,r)=>`<div class="time">${['08:00','10:00','14:00','16:00'][r]}</div>${Array.from({length:5},(_,c)=>{let e=events[r*5+c];return `<div>${e?`<button class="lesson" data-action="lesson">${state.room==='Gymnase 01'?e[0]:state.room==='Bibliothèque'?'Étude accompagnée':'Cours magistral'}<small>${e[1]}</small></button>`:''}</div>`}).join('')}`).join('')}</div></div><div class="calendar-note"><span>■ ${state.room} · Réservations confirmées</span><span>Week-end libre</span></div></div></div></section>`}
function menu(){return `<div class="mainmenu">${scene()}<section class="menu-copy"><div class="wordmark"><span class="crest">C</span>CAMPUS</div><span class="overline" style="margin-top:28px;color:var(--gold)">Tycoon universitaire</span><h1>Votre campus.<br><em>Vos ambitions.</em></h1><p>Un terrain. Une ambition. Des générations à inspirer. Bâtissez une université à votre image.</p><nav class="menu-actions" aria-label="Menu principal"><button data-goto="game">Continuer la partie <span>→</span></button><button data-action="new">Nouvelle université <span>+</span></button><button data-action="saves">Charger une partie <span>↗</span></button><button data-action="settings">Paramètres <span>↗</span></button></nav><footer>MONTBRUN · SEMAINE 1 &nbsp; / &nbsp; SAUVEGARDE LOCALE</footer></section><div class="campus-tag"><span class="overline">Votre université</span><strong>Domaine de Montbrun</strong><span class="muted">L'histoire commence avec vous.</span></div></div>`}
let toastTimer;
function render(){const t=themes[state.theme];board.dataset.theme=state.theme;board.dataset.screen=state.screen;board.innerHTML=(state.screen==='game'?game():state.screen==='planning'?planning():menu())+(state.screen==='menu'?'':timeControl())+'<div class="toast" role="status" aria-live="polite"></div>';document.querySelectorAll('.direction').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===state.theme));document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===state.screen));document.getElementById('board-label').textContent=`${t.number} — ${t.name.toUpperCase()} / ${{game:'EN PARTIE',planning:'PLANNING',menu:'MENU PRINCIPAL'}[state.screen]}`;document.getElementById('design-note').textContent=t.note;document.getElementById('palette').innerHTML=t.colors.map(c=>`<i style="background:${c}" aria-label="${c}"></i>`).join('')+`<span>${t.name}</span>`;}
function toast(message){clearTimeout(toastTimer);board.querySelector('.toast').textContent=message;toastTimer=setTimeout(()=>{const t=board.querySelector('.toast');if(t)t.textContent=''},4500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.matches('.direction')){state.theme=b.dataset.theme;render()}else if(b.dataset.screen||b.dataset.goto){state.screen=b.dataset.screen||b.dataset.goto;render()}else if(b.dataset.speed){state.speed=b.dataset.speed;render();toast(state.speed==='pause'?'Simulation en pause (aperçu)':'Vitesse ×'+state.speed+' sélectionnée (aperçu)')}else if(b.dataset.room){state.room=b.dataset.room;render()}else if(b.id==='focus'){const f=document.body.classList.toggle('focus');b.textContent=f?'Quitter le mode présentation ↙':'Agrandir la maquette ↗';b.setAttribute('aria-pressed',f)}else if(b.dataset.action){const a=b.dataset.action;if(a==='schedule'){state.scheduled=true;render();toast('Séance ajoutée le mercredi à 08:00 dans ce prototype.')}else toast({finance:'Aperçu finances : recettes 6 800 € · dépenses 4 350 € · solde +2 450 €.',build:'Construction : ce concept prévoit un catalogue de bâtiments dans un panneau dédié.',paths:'Chemins : aperçu du mode tracé. Le placement sera relié au moteur du jeu.',staff:'Personnel : 8 enseignants · 2 agents d’entretien · 1 poste à pourvoir.',lesson:'Séance confirmée · Encadrant : Camille Martin · 24 étudiants.',new:'Prototype : la création d’une université sera reliée au jeu.',saves:'Sauvegarde disponible : Domaine de Montbrun · Semaine 1.',settings:'Prototype : les réglages du jeu seront accessibles depuis cet écran.'}[a]||'Aperçu interactif')}});
render();
</script>
</body>
</html>
